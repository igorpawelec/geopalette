# The agreement between the two packages: rgeopalette in r/ against
# pygeopalette in python/, both taken from the commit under test. Runs when
# either folder changes, because either side can move the numbers.

on:
  push:
    branches: [main]
    paths: ["python/**", "r/**", ".github/workflows/parity.yml"]
  pull_request:
    paths: ["python/**", "r/**", ".github/workflows/parity.yml"]
  workflow_dispatch:

name: parity

permissions: read-all

jobs:
  agreement:
    # Puts a number on how far this package sits from pygeopalette. It is a
    # measurement, not a pass/fail equality check — the two cannot be equal,
    # because pygeopalette stores single precision and R has only double. The
    # script fails only if a component drifts past its documented tolerance
    # or if the component names stop matching.
    runs-on: ubuntu-latest
    name: rgeopalette agreement with pygeopalette

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        working-directory: r

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          working-directory: r

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pygeopalette from this commit
        # From python/ in the same checkout, so the two halves of one commit
        # are compared with each other. While the packages lived in separate
        # repositories this step installed pygeopalette from a pinned tag,
        # because a commit over there could turn this job red with nothing
        # changed here. In one repository the commit that moves a conversion
        # is the commit under test, so there is nothing left to pin.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ../python

      - name: Check the version declarations agree
        # CITATION.cff is .Rbuildignore'd, so R CMD check never sees it.
        run: Rscript tools/check_versions.R

      - name: Install rgeopalette
        run: R CMD INSTALL .

      - name: Generate reference bands from pygeopalette
        run: python tools/generate_pygeopalette_reference.py

      - name: Compare
        run: Rscript tools/cross_validate_against_pygeopalette.R
